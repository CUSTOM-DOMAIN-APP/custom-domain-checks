<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Status</title>
<style>
:root{
  --bg:#fafaf9;--card:#ffffff;--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;
  --done:#15803d;--done-bg:#dcfce7;--doing:#1d4ed8;--doing-bg:#dbeafe;
  --todo:#78716c;--todo-bg:#f5f5f4;--blocked:#b45309;--blocked-bg:#fef3c7;
  --fail:#b91c1c;--fail-bg:#fee2e2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0a09;--card:#1c1917;--ink:#f5f5f4;--muted:#a8a29e;--line:#292524;
    --done:#4ade80;--done-bg:#14532d;--doing:#93c5fd;--doing-bg:#1e3a8a;
    --todo:#a8a29e;--todo-bg:#292524;--blocked:#fcd34d;--blocked-bg:#78350f;
    --fail:#fca5a5;--fail-bg:#7f1d1d;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0a09;--card:#1c1917;--ink:#f5f5f4;--muted:#a8a29e;--line:#292524;
  --done:#4ade80;--done-bg:#14532d;--doing:#93c5fd;--doing-bg:#1e3a8a;
  --todo:#a8a29e;--todo-bg:#292524;--blocked:#fcd34d;--blocked-bg:#78350f;
  --fail:#fca5a5;--fail-bg:#7f1d1d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:22px;line-height:1.25;margin:0 0 6px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px;font-weight:600}
.meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.s-done{color:var(--done);background:var(--done-bg)}
.s-doing{color:var(--doing);background:var(--doing-bg)}
.s-todo{color:var(--todo);background:var(--todo-bg)}
.s-blocked{color:var(--blocked);background:var(--blocked-bg)}
.s-failed{color:var(--fail);background:var(--fail-bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.now{font-size:16px}
.bar{height:6px;background:var(--todo-bg);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--done)}
ul{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .pill{flex:none;min-width:74px;text-align:center}
.steps small{display:block;color:var(--muted)}
.tl li{display:grid;grid-template-columns:68px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}
.ask li{padding:8px 0;border-top:1px solid var(--line)}
.ask li:first-child{border-top:0}
a{color:var(--doing)}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main id="app"></main>

<!--
  HOW TO USE (for Claude sessions): edit ONLY the JSON below, then republish the
  artifact with the same file path. Plain English, no jargon, no dashes.
  status values: todo | doing | done | blocked | failed
-->
<script type="application/json" id="data">
{
  "title": "Session title in plain words",
  "goal": "One sentence: what the owner asked for and why it matters.",
  "status": "doing",
  "updated": "2026-11-15 10:42",
  "now": "What the session is doing at this moment, in one sentence.",
  "steps": [
    {"text": "First step", "status": "done", "note": "Short result"},
    {"text": "Second step", "status": "doing", "note": ""},
    {"text": "Third step", "status": "todo", "note": ""}
  ],
  "timeline": [
    {"time": "10:05", "text": "Started. Read the request and the code involved."},
    {"time": "10:30", "text": "Finished the first step."}
  ],
  "needs_you": [],
  "results": [
    {"text": "Pull request, live page, report, etc.", "url": ""}
  ]
}
</script>
<script>
(function(){
  var d = JSON.parse(document.getElementById('data').textContent);
  var label = {todo:'To do',doing:'Working',done:'Done',blocked:'Waiting',failed:'Failed'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function pill(s){return '<span class="pill s-'+esc(s)+'">'+esc(label[s]||s)+'</span>';}
  var steps = d.steps||[], done = steps.filter(function(s){return s.status==='done';}).length;
  var pct = steps.length ? Math.round(done*100/steps.length) : 0;
  var h = '';
  h += '<h1>'+esc(d.title)+'</h1>';
  h += '<div class="meta">'+pill(d.status)+'<span>'+done+' of '+steps.length+' steps done</span><span>Updated '+esc(d.updated)+'</span></div>';
  h += '<h2>Goal</h2><div class="card">'+esc(d.goal)+'</div>';
  h += '<h2>Right now</h2><div class="card now">'+esc(d.now)+'<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  if ((d.needs_you||[]).length){
    h += '<h2>Needs you</h2><div class="card"><ul class="ask">'+d.needs_you.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
  }
  h += '<h2>Steps</h2><div class="card"><ul class="steps">'+(steps.length?steps.map(function(s){
    return '<li>'+pill(s.status)+'<div>'+esc(s.text)+(s.note?'<small>'+esc(s.note)+'</small>':'')+'</div></li>';
  }).join(''):'<li class="empty">No steps yet</li>')+'</ul></div>';
  h += '<h2>Timeline</h2><div class="card"><ul class="tl">'+((d.timeline||[]).slice().reverse().map(function(t){
    return '<li><time>'+esc(t.time)+'</time><span>'+esc(t.text)+'</span></li>';
  }).join('')||'<li class="empty">Nothing yet</li>')+'</ul></div>';
  if ((d.results||[]).length){
    h += '<h2>Results</h2><div class="card"><ul class="ask">'+d.results.map(function(r){
      return '<li>'+(r.url?'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.text)+'</a>':esc(r.text))+'</li>';
    }).join('')+'</ul></div>';
  }
  document.getElementById('app').innerHTML = h;
  document.title = d.title || 'Session Status';
})();
</script>
</body>
</html>
